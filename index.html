<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lexicon - Researcher Prototype</title>
</head>
<body>
    <div id="app">
        <div id="header">
            <div id="header-left">
                <button id="history-toggle" class="header-btn" title="Toggle history">◈</button>
                <button id="settings-toggle" class="header-btn" title="Researcher Settings">⚙</button>
                <h1>The Lexicon</h1>
            </div>
            <div id="header-right">researcher prototype</div>
        </div>

        <div id="main">
            <!-- Settings Sidebar -->
            <div id="settings-sidebar" class="sidebar collapsed">
                <div class="sidebar-header">
                    <h2>Researcher Controls</h2>
                    <button id="settings-close" class="close-btn">&times;</button>
                </div>
                <div class="sidebar-content">
                    <div class="control-group">
                        <label>NLP Complexity</label>
                        <select id="nlp-level">
                            <option value="fragmentary">Fragmentary (Basic Graph)</option>
                            <option value="standard" selected>Standard (Statistical)</option>
                            <option value="dense">Dense (Centrality)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Damping Factor: <span id="damping-val">0.85</span></label>
                        <input type="range" id="damping-factor" min="0" max="1" step="0.01" value="0.85">
                    </div>
                    <div class="control-group">
                        <label>Clustering Sensitivity: <span id="cluster-val">12</span></label>
                        <input type="range" id="cluster-sensitivity" min="2" max="50" step="1" value="12">
                    </div>
                    <div class="control-group">
                        <label>Blacklist (comma separated)</label>
                        <textarea id="word-blacklist" rows="4" placeholder="word1, word2..."></textarea>
                    </div>
                    <button id="save-settings" class="primary-btn">Save Configuration</button>
                </div>
            </div>

            <div id="history-sidebar" class="sidebar collapsed">
                <div class="sidebar-header">
                    <h2>History</h2>
                    <button id="history-close" class="close-btn">&times;</button>
                </div>
                <div id="history-list"></div>
            </div>

            <div id="stage">
                <div id="viz-container">
                    <div id="vocab-empty">Awaiting input...</div>
                    <canvas id="viz-canvas"></canvas>
                </div>

                <div id="reading-view">
                    <div id="reading-card">
                        <div id="cast-number"></div>
                        <div id="reading-scroll">
                            <div id="reading-sign"></div>
                            <div id="reading-body"></div>
                            <div id="reading-thread"></div>
                            <div id="reading-seal"></div>
                        </div>
                        <div id="reading-footer">
                            <div id="sigil-container"></div>
                            <div id="reading-stats"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="input-area">
                <textarea id="speak-input" placeholder="Enter text to analyze..."></textarea>
                <div id="controls">
                    <button id="cast-btn" disabled>4 more terms to cast</button>
                    <button id="clear-btn">Clear</button>
                    <button id="copy-btn">Copy</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
